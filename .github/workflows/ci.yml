name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # macos-14 镜像已被 GitHub 下线（2026-11-06 起 job 直接 cancelled：
    # "The configuration 'macos-14-arm64-us-default' is not supported"），用 latest。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 侧车 + 冒烟测试（起服务 → 探活 → 收尾断言）
        run: |
          npm run sidecar
          npm run smoke

      - name: 单元测试
        run: cd src-tauri && cargo test
