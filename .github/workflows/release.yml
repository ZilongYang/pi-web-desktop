name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    # macos-14 镜像已被 GitHub 下线（2026-11-06 起 job 直接 cancelled）；
    # 公开仓库的 macos-latest 是 Apple Silicon，产物仍是 darwin-aarch64。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 装侧车（npm 包 + Node + 裁剪）
        run: npm run sidecar

      - name: 单元测试
        run: cd src-tauri && cargo test

      - name: 构建 .app（含 updater 包）
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ./node_modules/.bin/tauri build --bundles app \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: 启动冒烟（App 真的能起来，0.2.9 的教训）
        run: node scripts/smoke-app.mjs

      - name: 打发布包（ad-hoc 签名 / dmg / SHA256SUMS）
        run: bash scripts/make-dist.sh

      - name: 生成 updater 清单 latest.json
        run: |
          python3 - <<'PY'
          import json, pathlib, hashlib, subprocess
          version = json.loads(pathlib.Path("src-tauri/tauri.conf.json").read_text())["version"]
          sig_path = pathlib.Path("dist") / f"Pi-Web-Desktop-{version}-aarch64.app.tar.gz.sig"
          tar_path = pathlib.Path("dist") / f"Pi-Web-Desktop-{version}-aarch64.app.tar.gz"
          if not sig_path.exists():
              raise SystemExit("缺少 updater 签名文件，检查 TAURI_SIGNING_PRIVATE_KEY")
          manifest = {
              "version": version,
              "notes": f"Pi Web Desktop {version}",
              "pub_date": subprocess.check_output(
                  ["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"], text=True
              ).strip(),
              "platforms": {
                  "darwin-aarch64": {
                      "signature": sig_path.read_text().strip(),
                      "url": f"https://github.com/ZilongYang/pi-web-desktop/releases/download/v{version}/{tar_path.name}",
                  }
              },
          }
          pathlib.Path("dist/latest.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2)[:400])
          PY

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          TAG="v$VERSION"
          # 版本号带预发布后缀（如 0.3.0-beta.1）=> beta 通道：发成 pre-release，
          # 这样 GitHub 的 releases/latest 不会被它抢走（正式版通道继续看上一个稳定版）。
          PRERELEASE_FLAG=""
          case "$VERSION" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "$TAG" \
            "dist/Pi-Web-Desktop-$VERSION-aarch64.dmg" \
            "dist/Pi-Web-Desktop-$VERSION-aarch64.zip" \
            "dist/Pi-Web-Desktop-aarch64.dmg" \
            "dist/Pi-Web-Desktop-aarch64.zip" \
            "dist/Pi-Web-Desktop-$VERSION-aarch64.app.tar.gz" \
            "dist/Pi-Web-Desktop-$VERSION-aarch64.app.tar.gz.sig" \
            "dist/latest.json" \
            "dist/SHA256SUMS" \
            --title "Pi Web Desktop v$VERSION" \
            --notes "Pi Web Desktop v$VERSION —— 见 README 与 docs/。" \
            $PRERELEASE_FLAG \
            || gh release upload "$TAG" dist/* --clobber

          # beta 通道清单：固定 tag `channel-beta` 的 Release，只放 latest.json。
          # App 的测试版通道读 releases/download/channel-beta/latest.json。
          # （清单单独放，避免像 F14 那样挂到应用 Release 上被 --clobber 冲掉）
          if [ -n "$PRERELEASE_FLAG" ]; then
            gh release view channel-beta >/dev/null 2>&1 \
              || gh release create channel-beta \
                   --title "beta 通道清单" \
                   --notes "测试版通道的更新清单（由 CI 自动覆盖，勿手工修改）。" \
                   --prerelease
            gh release upload channel-beta dist/latest.json --clobber
            echo "已更新 beta 通道清单"
          fi
