name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 侧车 + 冒烟测试（起服务 → 探活 → 收尾断言）
        run: |
          npm run sidecar
          npm run smoke

      - name: 单元测试
        run: cd src-tauri && cargo test
